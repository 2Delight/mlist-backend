name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4
        
      - name: Build
        run: make build

      # - name: Archive
      #   run: tar -czvf bin.tar.gz bin/

      # - name: Upload Binaries
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: bin.tar.gz
      #     path: bin.tar.gz

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Test
        run: make test
